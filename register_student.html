<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Student Registration</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="register_admin.html">Admin Registration</a></li>
                    <li><a href="allocate_room.html">Room Allocation</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container fade-in">
        <form action="register_student.php" method="POST" class="card">
            <h2>Register as a Student</h2>
            
            <label for="student_id">Student ID:</label>
            <input type="text" name="student_id" id="student_id" required placeholder="Enter your Student ID">

            <label for="name">Name:</label>
            <input type="text" name="name" id="name" required placeholder="Enter your Full Name">

            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required placeholder="Enter your Email Address">

            <label for="course">Course:</label>
            <select name="course" id="course" required>
                <option value="" disabled selected>Select your Course</option>
                <option value="SE">SE</option>
                <option value="DMBI">DMBI</option>
                <option value="WT">WT</option>
                <option value="CNS">CNS</option>
            </select>

            <button type="submit" class="btn-primary">Register</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Hostel Management System. All rights reserved.</p>
    </footer>
</body>
</html>

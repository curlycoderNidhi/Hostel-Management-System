<!DOCTYPE html>
<html>
<head>
  <title>Register Hostel Resident</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f5f5f5;
    }
    form {
      background: #fff;
      padding: 20px;
      width: 400px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    label {
      font-weight: bold;
    }
    input[type="submit"] {
      background-color: #28a745;
      color: white;
      cursor: pointer;
      border: none;
    }
    input[type="submit"]:hover {
      background-color: #218838;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <form action="register_resident.php" method="POST" enctype="multipart/form-data">
    <h2>Register Hostel Resident</h2>

    <label>Full Name:</label>
    <input type="text" name="full_name" required>

    <label>Gender:</label>
    <select name="gender" required>
      <option value="">-- Select Gender --</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label>Course:</label>
    <input type="text" name="course_name" required>

    <label>Academic Year:</label>
    <input type="number" name="academic_year" required>

    <label>Contact Number:</label>
    <input type="text" name="contact_number" required>

    <label>Room Number:</label>
    <input type="number" name="room_number" required>

    <label>Mess Type:</label>
    <select name="mess_type" required>
      <option value="">-- Select Mess Type --</option>
      <option value="Veg">Veg</option>
      <option value="Non-Veg">Non-Veg</option>
    </select>

    <label>Safety Incident (Optional):</label>
    <input type="text" name="incident">

    <label>Upload Profile Photo:</label>
    <input type="file" name="image" accept="image/*" required>

    <input type="submit" value="Register">
  </form>

</body>
</html>

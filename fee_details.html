<script>
    const feeData = {
        "Summer": {
            "2": "61850",
            "4": "61850",
            "6": "59000",
            "8": "59000"
        },
        "Winter": {
            "3": "64100",
            "5": "64100",
            "7": "61250"
        }
    };

    function updateSemesters() {
        const term = document.getElementById("term").value;
        const semesterSelect = document.getElementById("semester");
        const amountSelect = document.getElementById("amount");

        semesterSelect.innerHTML = '<option value="">Select Semester</option>';
        amountSelect.innerHTML = '<option value="">Select Amount</option>';

        if (term && feeData[term]) {
            Object.keys(feeData[term]).forEach(sem => {
                semesterSelect.innerHTML += `<option value="${sem}">${sem}</option>`;
            });
        }
    }

    function updateAmount() {
        const term = document.getElementById("term").value;
        const sem = document.getElementById("semester").value;
        const amountSelect = document.getElementById("amount");

        amountSelect.innerHTML = '<option value="">Select Amount</option>';

        if (term && sem && feeData[term] && feeData[term][sem]) {
            const amount = feeData[term][sem];
            amountSelect.innerHTML += `<option value="${amount}">Rs. ${amount}</option>`;
        }
    }

    document.getElementById("branch").addEventListener("change", function () {
        const branch = this.value;
        const subBranchContainer = document.getElementById("subBranchContainer");
        subBranchContainer.style.display = (branch === "Engineering" || branch === "M.Tech") ? "block" : "none";
    });
</script>
